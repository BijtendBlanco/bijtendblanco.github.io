<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="description" content="Bijtend Blanco. Web consultancy firm.">
        <meta name="keywords" content="Web development, Web design, Consultancy">
        <meta name="author" content="Peter Briers">
        <meta name="color-scheme" content="only light">
        <meta name="theme-color" content="#ffffff">
        <title>Bijtend Blanco</title>
        <style>
            /*
             * Three layers on one shared timing:
             *  - body::before burns: a flat full-page white layer whose
             *    contrast() pushes white past 1.0, which HDR screens show
             *    brighter than normal white. Nothing is drawn inside it, so
             *    it stays cheap at full screen.
             *  - .splash melts: a small white box around the logo with blur()
             *    and the same contrast(), thresholding the blurred letters
             *    into goo. Its white burns exactly as bright as the page
             *    behind it, so the box never shows.
             *  - .logo adds the red and cyan ghosts.
             *  - header and footer develop: the company details in the
             *    corners fade in on the same curve, surfacing as the white
             *    burns down.
             * Fill is backwards only, so once done no filter lingers.
             */
            :root {
                --reveal: 12.5s cubic-bezier(0, 1, 1, 1) 125ms backwards;
            }

            @keyframes burn {
                from { filter: contrast(10); }
                to   { filter: none; }
            }

            @keyframes melt {
                from { filter: blur(12px) contrast(10); }
                to   { filter: none; }
            }

            @keyframes ghost {
                from { text-shadow: 7px 27px 12px red, -7px -5px 8px cyan; }
                to   { text-shadow: none; }
            }

            @keyframes develop {
                from { opacity: 0; }
                to   { opacity: 1; }
            }

            * {
                margin: 0;
            }

            html {
                background: white;
            }

            body {
                display: grid;
                grid-template: 1fr 2fr 2fr 1fr / 1fr 2fr 2fr 1fr;
                min-height: 100dvh;
            }

            body::before {
                content: "";
                position: fixed;
                inset: 0;
                z-index: -1;
                background: white;
                animation: burn var(--reveal);
            }

            .splash {
                grid-area: 3 / 3;
                place-self: start;
                /* Room for the ghosts and blur, pulled back so the text sits where it always did. */
                padding: 40px;
                margin: -30px;
                background: white;
                animation: melt var(--reveal);
            }

            .logo {
                font: 400 4rem/0.85 Helvetica, Arial, sans-serif;
                animation: ghost var(--reveal);
            }

            .logo > span {
                letter-spacing: -0.6px;
            }

            header, footer {
                position: fixed;
                inset-inline: 0;
                display: flex;
                justify-content: space-between;
                gap: 1rem;
                padding: 1.25rem;
                font: 400 0.8125rem/1.3 Helvetica, Arial, sans-serif;
                animation: develop var(--reveal);
            }

            header {
                top: 0;
            }

            footer {
                bottom: 0;
            }

            footer a {
                color: inherit;
                text-decoration: none;
            }

            footer a:hover, footer a:focus-visible {
                text-decoration: underline;
            }

            @media (prefers-reduced-motion: reduce) {
                body::before, .splash, .logo, header, footer {
                    animation: none;
                }
            }
        </style>
    </head>
    <body>
        <header>
            <p>Bijtend Blanco BV</p>
            <p>Web development</p>
        </header>
        <div class="splash">
            <h1 class="logo"><span>BIJTEND</span><br>BLANCØ</h1>
        </div>
        <footer>
            <a href="mailto:peter@bijtendblanco.be">peter@bijtendblanco.be</a>
            <p>VAT BE 0688.893.010</p>
        </footer>
    </body>
</html>
